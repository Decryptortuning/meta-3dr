# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "3dr"
BBFILE_PATTERN_3dr := "^${LAYERDIR}/"
BBFILE_PRIORITY_3dr = "6"

# Product distro, images and recipe appends require these layer collections.
LAYERDEPENDS_3dr = "core openembedded-layer networking-layer fsl-sdk-release"

# Declare compatibility with Yocto scarthgap series.
LAYERSERIES_COMPAT_3dr = "scarthgap"

# Unsupported historical recipes remain readable, never selectable.
BBMASK += "/meta-3dr/recipes\-core/images/3dr\-image\.bb$ /meta-3dr/recipes\-firmware/artoo/artoo\-firmware_3\.0\.0\.bb$ /meta-3dr/recipes\-connectivity/hostapd/hostap\-daemon_2\.4\.bb$ /meta-3dr/recipes\-connectivity/iw/iw_4\.1\.bb$ /meta-3dr/recipes\-devtools/python/python3\-pyserial_2\.7\.bb$ /meta-3dr/recipes\-devtools/python/python3\-pyparsing_2\.0\.1\.bb$ /meta-3dr/recipes\-devtools/python/python3\-posix\-ipc_0\.9\.9\.bb$ /meta-3dr/recipes\-support/libusb/libusb1_1\.0\.20\.bb$"

# All installed timeout consumers use Python 3 time.monotonic.
BBMASK += "/meta-3dr/recipes-devtools/python/python3-monotonic_0\.6\.bb$"

# NXP's 3.2-only engine patches are not a compatible wildcard for OpenSSL 3.5.
# The owned 3.5 append preserves generic engine/KTLS build policy explicitly.
BBMASK += "/meta-imx/meta-imx-bsp/recipes-connectivity/openssl/openssl_3\.2\.%\.bbappend$"

# The demo layer's priority-7 IPC1.1.1 shadows maintained meta-python priority5.
# Solo's SharedMemory/Semaphore consumers use the reviewed1.2 API unchanged.
BBMASK += "/meta-nxp-demo-experience/recipes-examples/imx-smart-kitchen/python3-posix-ipc_1\.1\.1\.bb$"

# Unsupported Matter demo is outside Solo's image/packagegroup closure. Its
# unconditional AUTOREV contacts upstream even during a fresh offline parse.
BBMASK += "/meta-nxp-connectivity/meta-nxp-matter-baseline/recipes-matter/matter/matter\.bb$"
