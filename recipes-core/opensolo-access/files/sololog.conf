Match User sololog
    AuthorizedKeysFile /etc/opensolo/log-receiver/authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/bin/rrsync -wo -munge /log/solo/dataflash
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
