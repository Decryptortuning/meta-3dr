# No runtime makestep/initstepslew: control timestamps must not jump.
# Only the bounded early rcS bootstrap may step, before bridge/flight startup.
sourcedir /etc/chrony/sources.d
driftfile /run/chrony/drift
pidfile /run/chrony/chronyd.pid
bindcmdaddress /run/chrony/chronyd.sock
port 0
cmdport 0
leapsecmode slew
