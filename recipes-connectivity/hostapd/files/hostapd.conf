# Golden AP template: offline paired provisioning is required.
# TKIP retained until phone/radio compatibility evidence permits retirement.
interface=wlan0-ap
driver=nl80211
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
ssid=SoloLink_Default
ieee80211d=1
hw_mode=g
channel=0
acs_num_scans=8
chanlist=4 5 6 7 8 9 10 11
beacon_int=100
dtim_period=2
max_num_sta=255
rts_threshold=2347
fragm_threshold=2346
macaddr_acl=0
auth_algs=3
ignore_broadcast_ssid=0
wmm_enabled=1
wmm_ac_bk_cwmin=4
wmm_ac_bk_cwmax=10
wmm_ac_bk_aifs=7
wmm_ac_bk_txop_limit=0
wmm_ac_bk_acm=0
wmm_ac_be_aifs=3
wmm_ac_be_cwmin=4
wmm_ac_be_cwmax=10
wmm_ac_be_txop_limit=0
wmm_ac_be_acm=0
wmm_ac_vi_aifs=2
wmm_ac_vi_cwmin=2
wmm_ac_vi_cwmax=4
wmm_ac_vi_txop_limit=136
wmm_ac_vi_acm=0
wmm_ac_vo_aifs=2
wmm_ac_vo_cwmin=2
wmm_ac_vo_cwmax=3
wmm_ac_vo_txop_limit=1
wmm_ac_vo_acm=0
disassoc_low_ack=1
ieee80211n=1
ht_capab=[TX-STBC][RX-STBC1][LDPC][SHORT-GI-20]
eapol_key_index_workaround=0
eap_server=1
own_ip_addr=127.0.0.1
wpa=2
wpa_pairwise=TKIP CCMP
wps_state=0
